name: nexus_flutter
description: Nexus – Skill Exchange Platform
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Supabase
  supabase_flutter: ^2.5.6

  # Map
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # State management
  provider: ^6.1.2

  # Location
  geolocator: ^12.0.0

  # Image picker (avatar upload)
  image_picker: ^1.1.2

  # Networking
  http: ^1.2.1

  # Cached images
  cached_network_image: ^3.3.1

  # Fonts
  google_fonts: ^6.2.1

  # Icons
  cupertino_icons: ^1.0.8

  # Url launcher
  url_launcher: ^6.3.0

  # Flutter SVG (optional icons)
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
